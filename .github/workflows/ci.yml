name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node -e "import('./server.js').then(()=>setTimeout(()=>process.exit(0),1200))"
        env:
          PORT: 3456
          DATA_DIR: /tmp/tongpin-ci-data
          UPLOAD_DIR: /tmp/tongpin-ci-uploads
