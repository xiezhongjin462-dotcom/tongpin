services:
  - type: web
    name: tongpin
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: HOST
        value: 0.0.0.0
    disk:
      name: tongpin-data
      mountPath: /var/data
      sizeGB: 1
